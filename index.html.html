<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>報價單工具 Quotation Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3EE;--panel:#fff;--border:#D8D4CC;--border-light:#EAE7E0;
  --accent:#1A5276;--accent-light:#EBF5FB;--text:#1C1C1C;--text-muted:#6B6860;
  --text-ph:#AEACA6;--danger:#C0392B;--input-bg:#FAFAF8;
  --shadow:0 4px 16px rgba(0,0,0,.10);--r:8px;--rs:4px;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--accent);color:#fff;padding:0 1.5rem;height:52px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:100;flex-shrink:0}
header h1{font-size:14px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
header h1 span{font-size:11px;opacity:.6;font-family:'DM Mono',monospace}
.header-btns{display:flex;gap:6px;align-items:center}
.mode-toggle{display:flex;background:rgba(0,0,0,.25);border-radius:6px;padding:3px;gap:2px;margin-left:12px}
.mode-btn{background:none;border:none;color:rgba(255,255,255,.65);padding:4px 12px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;white-space:nowrap}
.mode-btn.active{background:#fff;color:var(--accent)}
.btn-hdr{border:none;padding:6px 14px;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.btn-hdr-save{background:#27AE60;color:#fff}.btn-hdr-save:hover{background:#2ECC71}
.btn-hdr-rec{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}.btn-hdr-rec:hover{background:rgba(255,255,255,.28)}
.btn-hdr-pdf{background:#fff;color:var(--accent)}.btn-hdr-pdf:hover{background:#EBF5FB}
.workspace{display:flex;flex:1;min-height:0;overflow:hidden}
.form-panel{background:var(--panel);overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;flex-shrink:0;width:480px;min-width:260px}
.resizer{width:6px;background:var(--border-light);cursor:col-resize;flex-shrink:0;position:relative;z-index:10;transition:background .15s}
.resizer::before{content:'⋮';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--border);font-size:18px;pointer-events:none}
.resizer:hover,.resizer.dragging{background:var(--accent)}
.resizer:hover::before,.resizer.dragging::before{color:rgba(255,255,255,.5)}
.preview-panel{background:#D8D4CC;overflow-y:auto;padding:2rem;display:flex;justify-content:center;align-items:flex-start;flex:1;min-width:0}
.card{background:var(--panel);border-radius:var(--r);border:1px solid var(--border);padding:.9rem .9rem .7rem}
.section-title{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.6rem;padding-bottom:.35rem;border-bottom:1px solid var(--border-light)}
.form-group{display:flex;flex-direction:column;gap:3px;margin-bottom:.55rem}
.form-group label{font-size:11px;font-weight:500;color:var(--text-muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.form-row-3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.5rem}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--input-bg);border:1px solid var(--border);border-radius:var(--rs);padding:6px 9px;font-size:12.5px;font-family:'Noto Sans TC',sans-serif;color:var(--text);width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,82,118,.10)}
input::placeholder,textarea::placeholder{color:var(--text-ph)}
textarea{resize:vertical;min-height:50px;line-height:1.5}
.pi-only{display:none}.pi-only.show{display:block}
/* Contact selector */
.csrow{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.csrow select{flex:1}
.btn-icon{background:none;border:1px solid var(--border);border-radius:var(--rs);padding:5px 9px;font-size:12px;cursor:pointer;color:var(--text-muted);transition:all .15s;font-family:'Noto Sans TC',sans-serif;white-space:nowrap}
.btn-icon:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.btn-icon.danger:hover{border-color:var(--danger);color:var(--danger);background:#FDF2F2}
.edit-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.75rem;margin-bottom:.5rem;display:none}
.edit-panel.open{display:block}
.edit-panel .form-group{margin-bottom:.45rem}
.edit-panel-label{font-size:10px;font-weight:600;color:var(--accent);margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid var(--border-light);text-transform:uppercase;letter-spacing:.08em}
.edit-actions{display:flex;gap:6px;margin-top:.5rem}
.btn-save{background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.btn-cancel{background:none;border:1px solid var(--border);border-radius:var(--rs);padding:5px 14px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;color:var(--text-muted)}
/* Item cards */
.item-card{border:1px solid var(--border);border-radius:var(--r);padding:9px 11px 7px;margin-bottom:7px;background:var(--input-bg);transition:box-shadow .15s,opacity .15s}
.item-card.dragging{opacity:.4}
.item-card.drag-over{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent);background:var(--accent-light)}
.item-card-header{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.drag-handle{cursor:grab;color:#C8C5BE;font-size:15px;padding:0 2px;user-select:none;line-height:1}
.drag-handle:hover{color:var(--accent)}
.item-card-num{font-size:9px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent);background:var(--accent-light);border-radius:3px;padding:2px 6px}
.item-card-total{font-size:12px;font-family:'DM Mono',monospace;font-weight:600;flex:1;text-align:right;margin-right:5px}
.btn-remove{background:none;border:none;cursor:pointer;color:#BCBAB5;font-size:15px;padding:2px;border-radius:3px;line-height:1;transition:color .15s}
.btn-remove:hover{color:var(--danger)}
.desc-type-row{display:flex;gap:5px;margin-bottom:3px}
.desc-type-btn{flex:1;padding:4px 7px;font-size:11px;font-family:'Noto Sans TC',sans-serif;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;color:var(--text-muted);transition:all .15s}
.desc-type-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-add-item{display:flex;align-items:center;gap:5px;background:none;border:1px dashed var(--border);border-radius:var(--rs);padding:7px 11px;font-size:11.5px;color:var(--text-muted);cursor:pointer;width:100%;margin-top:5px;transition:all .15s;font-family:'Noto Sans TC',sans-serif}
.btn-add-item:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
/* Totals */
.totals-block{background:var(--bg);border-radius:var(--r);padding:.85rem;display:flex;flex-direction:column;gap:5px}
.totals-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.totals-row.grand{padding-top:7px;border-top:1.5px solid var(--border);font-weight:600;font-size:14px;color:var(--accent)}
.totals-row label{color:var(--text-muted)}
.totals-val{font-family:'DM Mono',monospace;font-weight:500}
.tax-row{display:grid;grid-template-columns:1fr 90px;gap:7px;align-items:center;margin-bottom:.55rem}
.tax-row label{font-size:11px;font-weight:500;color:var(--text-muted)}
.date-row{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:7px;margin-bottom:.55rem;align-items:end}
/* Batch */
.batch-item{display:grid;grid-template-columns:1fr 130px 24px;gap:5px;align-items:center;margin-bottom:4px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--panel);border-radius:var(--r);box-shadow:0 8px 40px rgba(0,0,0,.22);width:92vw;max-width:1020px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-header h2{font-size:14px;font-weight:600}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted)}
.modal-toolbar{display:flex;gap:7px;align-items:center;padding:.6rem 1.25rem;border-bottom:1px solid var(--border-light);flex-shrink:0;flex-wrap:wrap}
.modal-toolbar label{font-size:11px;font-weight:500;color:var(--text-muted)}
.modal-toolbar select,.modal-toolbar input[type=text]{width:auto;padding:4px 9px;font-size:11.5px}
.modal-body{overflow-y:auto;flex:1}
.rec-table{width:100%;border-collapse:collapse;font-size:11.5px}
.rec-table thead th{background:var(--bg);border-bottom:1.5px solid var(--border);padding:8px 11px;text-align:left;font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;position:sticky;top:0}
.rec-table tbody tr{border-bottom:1px solid var(--border-light);transition:background .1s}
.rec-table tbody tr:hover{background:var(--accent-light)}
.rec-table tbody td{padding:8px 11px;vertical-align:middle}
.rec-tag{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:9.5px;padding:1px 5px;border-radius:3px;margin:1px 2px 1px 0;font-weight:500}
.rec-empty{text-align:center;padding:3rem;color:var(--text-muted);font-size:13px}
.btn-rec-del{background:none;border:none;cursor:pointer;color:#BCBAB5;font-size:13px;padding:2px 4px;border-radius:3px;transition:color .15s}
.btn-rec-del:hover{color:var(--danger)}
/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#27AE60;color:#fff;padding:9px 26px;border-radius:22px;font-size:12.5px;font-weight:600;font-family:'Noto Sans TC',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
/* Sync indicator */
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;display:inline-block;margin-right:4px;transition:background .3s}
.sync-dot.synced{background:#2ECC71}
.sync-dot.error{background:#E74C3C}
.sync-dot.syncing{background:#F39C12;animation:pulse .8s infinite}
.sync-dot.offline{background:#95A5A6}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Preview */
#quote-preview{background:#fff;width:794px;min-height:1123px;padding:40px 48px;box-shadow:var(--shadow);font-family:'Times New Roman',Times,serif;font-size:12px;color:#111}
.pv-letterhead{display:flex;align-items:stretch;gap:18px;margin-bottom:20px}
.pv-logo-img{width:110px;height:auto;object-fit:contain;flex-shrink:0;display:block}
.pv-company-info{flex:1;display:flex;flex-direction:column;justify-content:center}
.pv-company-name{font-size:18px;font-weight:700;color:#111;margin-bottom:3px;font-family:'Times New Roman',Times,serif}
.pv-company-details{font-size:11.5px;color:#222;line-height:1.6;font-family:'Times New Roman',Times,serif}
.pv-title{text-align:center;font-size:20px;font-weight:700;letter-spacing:.08em;margin-bottom:18px;color:#111;border-top:2px solid #111;border-bottom:2px solid #111;padding:7px 0;font-family:'Times New Roman',Times,serif}
.pv-meta-grid{display:grid;grid-template-columns:1fr auto;gap:0;margin-bottom:20px}
.pv-to-block{font-size:11.5px;color:#111;line-height:1.7;font-family:'Times New Roman',Times,serif}
.pv-to-label{font-size:10px;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.pv-info-table{border-collapse:collapse;font-size:11px;font-family:'Times New Roman',Times,serif}
.pv-info-table td{border:1px solid #999;padding:5px 11px;white-space:nowrap}
.pv-info-table td:first-child{background:#f0f0f0;font-weight:700;color:#333;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.pv-info-table td:last-child{text-align:right}
.pv-items-table{width:100%;border-collapse:collapse;font-size:11.5px;font-family:'Times New Roman',Times,serif}
.pv-items-table th{background:#f0f0f0;border:1px solid #999;padding:7px 9px;text-align:center;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#333}
.pv-items-table td{border:1px solid #ccc;padding:7px 9px;vertical-align:top}
.pv-items-table td.c{text-align:center}
.pv-items-table td.r{text-align:right}
.pv-items-table tr:nth-child(even) td{background:#FAFAFA}
.pv-bottom{display:grid;grid-template-columns:1fr auto}
.pv-remark{border:1px solid #999;border-top:none;border-right:none;padding:9px 11px;font-size:10.5px;color:#333;line-height:1.75;min-height:76px;font-family:'Times New Roman',Times,serif}
.pv-remark-label{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:3px}
.pv-totals-table{border-collapse:collapse;font-size:10.5px;font-family:'Times New Roman',Times,serif;width:176px;table-layout:fixed}
.pv-totals-table td{border:1px solid #999;padding:7px 9px}
.pv-totals-table td:first-child{background:#f0f0f0;font-weight:700;color:#444;text-transform:uppercase;font-size:9.5px;letter-spacing:.04em;width:88px;overflow:hidden}
.pv-totals-table td:last-child{text-align:right;font-weight:600;width:88px;overflow:hidden}
.pv-totals-table .grand-row td{font-size:10.5px;font-weight:700;color:#1A5276;background:#EBF5FB}
.pv-totals-table .grand-row td:first-child{background:#D6EAF8}
.pv-footer{margin-top:40px}
.pv-sig{font-size:11px;color:#333;display:inline-block;font-family:'Times New Roman',Times,serif}
.pv-sig-title{font-weight:700;margin-bottom:46px}
.pv-sig-line{border-top:1.5px solid #444;width:240px;margin-bottom:4px}
.pv-sig-name{font-size:11px;color:#555}
.pv-bank-block{margin-top:16px;border:1px solid #999;padding:9px 13px;font-size:10.5px;font-family:'Times New Roman',Times,serif;line-height:1.75;color:#111}
.pv-bank-title{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;border-bottom:1px solid #ccc;padding-bottom:3px}
.pv-bank-row{display:flex;gap:7px}
.pv-bank-label{font-weight:700;min-width:145px;flex-shrink:0}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:0">
    <h1>&#128196; 報價單工具 <span>Quotation · PI · Invoice</span></h1>
    <div class="mode-toggle">
      <button id="modeQuot" class="mode-btn active" onclick="setDocMode('quotation')">Quotation</button>
      <button id="modePI"   class="mode-btn" onclick="setDocMode('pi')">Proforma Invoice</button>
      <button id="modeInv"  class="mode-btn" onclick="setDocMode('invoice')">Invoice</button>
    </div>
  </div>
  <div class="header-btns">
    <span class="sync-dot" id="syncDot" title="雲端狀態"></span>
    <button class="btn-hdr btn-hdr-save" onclick="saveRecord()">&#128190; 儲存</button>
    <button class="btn-hdr btn-hdr-rec"  onclick="openRecords()">&#128203; 紀錄</button>
    <button class="btn-hdr btn-hdr-pdf"  onclick="exportPDF()">&#11015; PDF</button>
    <button class="btn-hdr" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)" onclick="testConnection()">&#128268; 測試連線</button>
  </div>
</header>

<!-- Records Modal -->
<div class="modal-overlay" id="recordsModal" onclick="if(event.target===this)closeRecords()">
  <div class="modal">
    <div class="modal-header">
      <h2>&#128203; 報價紀錄 Records</h2>
      <button class="modal-close" onclick="closeRecords()">&#x2715;</button>
    </div>
    <div class="modal-toolbar">
      <label>搜尋</label>
      <input type="text" id="recSearch" placeholder="公司、品名、單號…" oninput="renderRecords()" style="width:170px">
      <label style="margin-left:6px">排序</label>
      <select id="recSort" onchange="renderRecords()">
        <option value="date_desc">日期 ↓ 最新</option>
        <option value="date_asc">日期 ↑ 最舊</option>
        <option value="buyer_asc">買方 A→Z</option>
        <option value="total_desc">金額 ↓</option>
      </select>
      <span id="recCount" style="margin-left:auto;font-size:11px;color:var(--text-muted)"></span>
    </div>
    <div class="modal-body">
      <table class="rec-table">
        <thead><tr>
          <th>日期</th><th>單號</th><th>買方</th><th>品名</th>
          <th>幣別</th><th style="text-align:right">總金額</th><th></th>
        </tr></thead>
        <tbody id="recTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="savedFlash"></div>

<div class="workspace">
  <div class="form-panel">

    <!-- SELLER -->
    <div class="card">
      <div class="section-title">賣方 Seller</div>
      <div class="form-group"><label>公司名稱</label><input type="text" id="sellerName" value="CHIEN SHEN ENTERPRISE CO., LTD." oninput="render()"></div>
      <div class="form-group"><label>Email</label><input type="text" id="sellerEmail" value="chienshen532@gmail.com" oninput="render()"></div>
      <div class="form-row">
        <div class="form-group"><label>TEL</label><input type="text" id="sellerTel" value="+886-6-2552939" oninput="render()"></div>
        <div class="form-group"><label>Fax</label><input type="text" id="sellerFax" value="+886-6-2553189" oninput="render()"></div>
      </div>
      <div class="form-group"><label>地址</label><textarea id="sellerAddr" oninput="render()">No. 32, Aly 97, Ln. 532, Sec. 1, AnJi Rd., Annan Dist., Tainan City 70953, Taiwan (R.O.C.)</textarea></div>
    </div>

    <!-- QUOTE INFO -->
    <div class="card">
      <div class="section-title">文件資訊 Doc Info</div>
      <!-- Quotation fields -->
      <div id="quotFields">
        <div class="form-row">
          <div class="form-group"><label>報價單號 Quot. #</label><input type="text" id="quotNum" value="2026050701" oninput="render()"></div>
          <div class="form-group"><label>日期</label><input type="date" id="quotDate" value="2026-05-07" oninput="render()"></div>
        </div>
      </div>
      <!-- PI fields -->
      <div id="piFields" style="display:none">
        <div class="form-row">
          <div class="form-group"><label>PI Number</label><input type="text" id="piNum" placeholder="PI-2026-001" oninput="render()"></div>
          <div class="form-group"><label>PI 日期</label><input type="date" id="piDate" oninput="render()"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>PO Number (買方)</label><input type="text" id="poNum" placeholder="買方PO號" oninput="render()"></div>
          <div class="form-group"><label style="opacity:0">-</label></div>
        </div>
      </div>
      <!-- Invoice fields -->
      <div id="invFields" style="display:none">
        <div class="form-row">
          <div class="form-group"><label>Invoice Number</label>
            <div style="display:flex;gap:4px">
              <input type="text" id="invNum" placeholder="INV-2026-001" oninput="render()" style="flex:1">
              <select id="invSuffix" onchange="render()" style="width:68px;padding:6px 4px">
                <option value="">—</option><option value="-1">-1</option><option value="-2">-2</option>
                <option value="-3">-3</option><option value="-4">-4</option><option value="-5">-5</option>
              </select>
            </div>
          </div>
          <div class="form-group"><label>Invoice 日期</label><input type="date" id="invDate" oninput="render()"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>PO Number（同步自 PI）</label><input type="text" id="invPoNum" placeholder="自動同步 PI PO號" oninput="render()"></div>
          <div class="form-group"><label>Ref. PI Number</label><input type="text" id="invRefPi" placeholder="關聯的 PI 號碼" oninput="render()"></div>
        </div>
        <div class="form-group"><label>已付訂金 Deposit Paid</label>
          <div style="display:flex;gap:5px;align-items:center">
            <select id="invDepositType" onchange="onDepositTypeChange();render()" style="width:105px;flex-shrink:0">
              <option value="none">不填 Skip</option><option value="amount">金額 Amount</option><option value="pct">百分比 %</option>
            </select>
            <input type="number" id="invDepositAmt" min="0" step="0.01" style="display:none;flex:1;text-align:right" oninput="render()">
            <input type="number" id="invDepositPct" min="0" max="100" step="1" style="display:none;width:75px;text-align:right" oninput="render()">

          <input type="text" id="incoLocation" placeholder="地點 e.g. Warsaw" style="margin-top:3px" oninput="render()">
        </div>
        <div class="form-group"><label>付款條件</label>
          <select id="paymentSel" onchange="handleSelectCustom('paymentSel','paymentCustom');render()">
            <option value="100% before shipment" selected>100% before shipment</option>
            <option value="50% down payment, 50% before shipment">50% + 50%</option>
            <option value="30% down payment, 70% before shipment">30% + 70%</option>
            <option value="T/T 30 days">T/T 30 days</option>
            <option value="L/C at sight">L/C at sight</option>
            <option value="__custom__">自訂…</option>
          </select>
          <input type="text" id="paymentCustom" placeholder="自訂付款" style="display:none;margin-top:3px" oninput="render()">
        </div>
        <div class="form-group"><label>幣別</label>
          <select id="currencySel" onchange="handleSelectCustom('currencySel','currencyCustom');render()">
            <option value="EUR" selected>EUR €</option><option value="USD">USD $</option>
            <option value="TWD">TWD NT$</option><option value="CNY">CNY ¥</option>
            <option value="GBP">GBP £</option><option value="__custom__">自訂…</option>
          </select>
          <input type="text" id="currencyCustom" placeholder="e.g. JPY ¥" style="display:none;margin-top:3px" oninput="render()">

      </div>

          <select id="contactSelect" onchange="onContactSelect()"></select>
          <button class="btn-icon" onclick="openEditPanel('contact','edit')">✏️</button>
          <button class="btn-icon danger" onclick="deleteSelectedContact()">🗑</button>
          <button class="btn-icon" onclick="openEditPanel('contact','new')">＋</button>
        </div>
      </div>
      <div class="edit-panel" id="contactEditPanel">
        <div class="edit-panel-label" id="contactEditLabel">新增客戶</div>
        <div class="form-group"><label>公司名稱 *</label><input type="text" id="ep_name" placeholder="必填"></div>
        <div class="form-group"><label>地址</label><input type="text" id="ep_addr"></div>
        <div class="form-row">
          <div class="form-group"><label>電話</label><input type="text" id="ep_phone"></div>
          <div class="form-group"><label>Email</label><input type="text" id="ep_email"></div>
        </div>
        <div class="edit-actions">
          <button class="btn-save" onclick="saveContact()">儲存</button>
          <button class="btn-cancel" onclick="closeEditPanel('contact')">取消</button>

const GAS_URL  = 'https://script.google.com/macros/s/AKfycbwHjKm6idp_jGTXxqXLOjwn8_NHrmlSo8de27DiL1Nfc_hzU7Y5uSdJbXj7Ida7WONe/exec';

function setSyncStatus(s) {
  const d = document.getElementById('syncDot');
  if (!d) return;
  d.className = 'sync-dot ' + s;
  d.title = s === 'synced' ? '已連線至雲端'
          : s === 'syncing' ? '同步中…'
          : s === 'error' ? '雲端連線失敗'
          : s === 'offline' ? '離線模式'
          : '未連線';
}
function showToast(msg, color) {
  const el = document.getElementById('savedFlash');
  if (!el) return;
  el.textContent = msg;
  el.style.background = color || '#27AE60';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
async function testConnection() {
  const url = GAS_URL;
  showToast('🔄 測試中…', '#F39C12');
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action: 'getContacts'})
    });
    if (!res.ok) {
      showToast(`❌ HTTP ${res.status} ${res.statusText}`, '#E74C3C');
      return;
    }
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch(e) {
      showToast('❌ 回應不是 JSON：' + text.slice(0,80), '#E74C3C');
      return;
    }
    if (json.ok) {
      setSyncStatus('synced');
      showToast('✓ 連線成功！', '#27AE60');
    } else {
      showToast('⚠ GAS 錯誤：' + json.error, '#E67E22');
    }
  } catch(e) {
    showToast('❌ ' + e.message, '#E74C3C');
    console.error('連線測試失敗:', e);
  }
}
async function gasCall(action, payload = {}) {
  if (window.location.protocol === 'file:') {
    throw new Error('local-file');
  }
  setSyncStatus('syncing');
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, ...payload})
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    setSyncStatus('synced');
    return json.data;
  } catch(e) {
    if (e.message === 'local-file') throw e;
    setSyncStatus('offline'); // silent offline state
    throw e;
  }
}

let docMode = 'quotation';
function setDocMode(mode) {
  docMode = mode;
  ['Quot','PI','Inv'].forEach(m => {
    const el = document.getElementById('mode'+m);
    if (el) el.classList.toggle('active', mode === {Quot:'quotation',PI:'pi',Inv:'invoice'}[m]);
  });
  const s = id => document.getElementById(id);
  if (s('quotFields')) s('quotFields').style.display = mode==='quotation'?'':'none';
  if (s('piFields'))   s('piFields').style.display   = mode==='pi'?'':'none';
  if (s('invFields'))  s('invFields').style.display  = mode==='invoice'?'':'none';
  document.querySelectorAll('.pi-only').forEach(e => e.style.display = (mode==='pi'||mode==='invoice')?'':'none');
  if (s('validDateGroup')) s('validDateGroup').style.display = (mode==='pi'||mode==='invoice')?'none':'';

    const poPi = s('poNum')?.value || '';
    if (s('invPoNum') && !s('invPoNum').value) s('invPoNum').value = poPi;
    const piN = s('piNum')?.value || '';

function renderRecords() {
  const search = (document.getElementById('recSearch')?.value||'').toLowerCase();
  const sort   = document.getElementById('recSort')?.value||'date_desc';
  const SYMS   = {EUR:'€',USD:'$',TWD:'NT$',CNY:'¥',GBP:'£'};
  const sym    = r => SYMS[r.currency]||r.currency||'';
  const fmtD   = s => s?(s+'').replace(/-/g,'/'):' ';
  const MC     = {quotation:'#1A5276',pi:'#7D3C98',invoice:'#1E8449'};
  const ML     = {quotation:'Q',pi:'PI',invoice:'INV'};
  let recs = quoteRecords.filter(r => {
    if (!search) return true;
    const hay = [r.quotNum,r.piNum,r.invNum,r.buyer,...(r.items||[]).map(it=>it.item)].join(' ').toLowerCase();
    return hay.includes(search);
  });
  recs.sort((a,b) => {
    if(sort==='date_desc') return b.id-a.id;
    if(sort==='date_asc')  return a.id-b.id;
    if(sort==='buyer_asc') return (a.buyer||'').localeCompare(b.buyer||'');
    if(sort==='total_desc')return b.total-a.total;
    return 0;
  });
  const cnt = document.getElementById('recCount');
  if(cnt) cnt.textContent = `共 ${recs.length} 筆`;
  const tbody = document.getElementById('recTableBody');
  if (!recs.length) { tbody.innerHTML='<tr><td colspan="7" class="rec-empty">尚無紀錄。按「儲存」新增。</td></tr>'; return; }
  tbody.innerHTML = recs.map(r => {
    const dm = r.docMode||'quotation';
    const dn = dm==='pi'?(r.piNum||''):dm==='invoice'?(r.invNum||''):(r.quotNum||'');
    const dd = dm==='pi'?(r.piDate||r.quotDate||''):dm==='invoice'?(r.invDate||r.quotDate||''):(r.quotDate||'');
    const badge = `<span style="background:${MC[dm]||'#999'};color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-right:3px">${ML[dm]||'Q'}</span>`;
    const itags = (r.items||[]).map(it=>`<span class="rec-tag">${escHtml(it.item)}</span>`).join('');
    const jsr = JSON.stringify(r).replace(/"/g,'&quot;');
    const btnStyle = (bg) => `style="background:${bg};color:#fff;border:none;border-radius:3px;padding:3px 8px;font-size:10.5px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans TC',sans-serif"`;
    return `<tr>
      <td style="white-space:nowrap;color:var(--text-muted)">${fmtD(dd)}</td>
      <td style="font-family:'DM Mono',monospace;font-size:10.5px">${badge}${escHtml(dn)}</td>
      <td style="font-weight:500">${escHtml(r.buyer||'')}</td>
      <td>${itags}</td>
      <td style="color:var(--text-muted)">${escHtml(r.currency||'')}</td>
      <td style="text-align:right;font-family:'DM Mono',monospace;font-weight:600">${sym(r)}${(r.total||0).toFixed(2)}</td>
      <td style="display:flex;gap:3px;align-items:center;flex-wrap:wrap">
        <button ${btnStyle('#1A5276')} onclick="setDocMode('quotation');loadRecordIntoForm(${jsr})">調出</button>
        <button ${btnStyle('#7D3C98')} onclick="setDocMode('pi');loadRecordIntoForm(${jsr})">→PI</button>
        <button ${btnStyle('#1E8449')} onclick="setDocMode('invoice');loadRecordIntoForm(${jsr})">→Inv</button>
        <button class="btn-rec-del" onclick="deleteRecord(${r.id})" title="刪除">🗑</button>
      </td>
    </tr>`;
  }).join('');
}
function saveRecord() {
  const {subtotal,tax,total} = calcTotals();
  const {code:curCode} = getCurrency();
  const incoTerm = getSelectVal('incoTermSel','incoTermCustom');
  const payment  = getSelectVal('paymentSel','paymentCustom');
  const rec = {
    id: Date.now(), savedAt: new Date().toISOString(), docMode,
    quotNum:v('quotNum'), quotDate:v('quotDate'),
    piNum:v('piNum'), piDate:v('piDate'), poNum:v('poNum'),
    invNum:(v('invNum')||'')+(v('invSuffix')||''), invDate:v('invDate'),
    invPoNum:v('invPoNum'), invRefPi:v('invRefPi'),
    invDepositType:v('invDepositType'), invDepositAmt:v('invDepositAmt'), invDepositPct:v('invDepositPct'),
    buyer:v('buyerName'), buyerPhone:v('buyerPhone'), buyerEmail:v('buyerEmail'), buyerAddr:v('buyerAddr'),
    incoTerm, payment, currency:curCode,
    items: items.map(it=>({...it})),
    batches: batches.map(b=>({...b})),
    subtotal, tax, total, remarks: buildRemarks(),
  };
  quoteRecords.unshift(rec);
  const btn = document.querySelector('.btn-hdr-save');
  if(btn){ btn.textContent='⏳ 儲存中…'; btn.disabled=true; }
  gasCall('saveRecord',{record:rec})
    .then(()=>showToast('✓ 已儲存至雲端'))
    .catch(e=>showToast(e.message==='local-file'?'⚠ 本地模式，紀錄未同步至雲端':'⚠ 雲端儲存失敗','#E67E22'))
    .finally(()=>{ if(btn){ btn.textContent='💾 儲存'; btn.disabled=false; } });
}
function loadRecordIntoForm(rec) {
  const s = (id,val) => { const e=document.getElementById(id); if(e) e.value=val||''; };
  s('sellerName',rec.seller); s('buyerName',rec.buyer); s('buyerAddr',rec.buyerAddr);
  s('buyerPhone',rec.buyerPhone); s('buyerEmail',rec.buyerEmail);
  // INCO
  const isel = document.getElementById('incoTermSel');
  const ivals = ['DAP','EXW','FOB','CIF','CIP','CFR','DDP','FCA'];
  if(ivals.includes(rec.incoTerm)){ isel.value=rec.incoTerm; document.getElementById('incoTermCustom').style.display='none'; }
  else{ isel.value='__custom__'; document.getElementById('incoTermCustom').style.display=''; s('incoTermCustom',rec.incoTerm); }
  // Payment
  const psel = document.getElementById('paymentSel');
  const pvals = Array.from(psel.options).map(o=>o.value).filter(v=>v!=='__custom__');
  if(pvals.includes(rec.payment)){ psel.value=rec.payment; document.getElementById('paymentCustom').style.display='none'; }
  else{ psel.value='__custom__'; document.getElementById('paymentCustom').style.display=''; s('paymentCustom',rec.payment); }
  // Currency
  const csel = document.getElementById('currencySel');
  const cvals = ['EUR','USD','TWD','CNY','GBP'];
  if(cvals.includes(rec.currency)){ csel.value=rec.currency; document.getElementById('currencyCustom').style.display='none'; }
  else{ csel.value='__custom__'; document.getElementById('currencyCustom').style.display=''; s('currencyCustom',rec.currency); }
  // Quot / PI / Inv numbers
  s('quotNum',rec.quotNum); s('quotDate',rec.quotDate);
  s('piNum',rec.piNum); s('piDate',rec.piDate); s('poNum',rec.poNum);
  if(rec.invNum){
    const suffs=['-5','-4','-3','-2','-1']; let base=rec.invNum,suf='';
    for(const ss of suffs){ if(rec.invNum.endsWith(ss)){ base=rec.invNum.slice(0,-ss.length); suf=ss; break; } }
    s('invNum',base); const isuf=document.getElementById('invSuffix'); if(isuf) isuf.value=suf;
  }
  s('invDate',rec.invDate); s('invPoNum',rec.invPoNum||rec.poNum||''); s('invRefPi',rec.invRefPi||rec.piNum||'');
  s('invDepositAmt',rec.invDepositAmt); s('invDepositPct',rec.invDepositPct);
  const idt = document.getElementById('invDepositType'); if(idt){ idt.value=rec.invDepositType||'none'; onDepositTypeChange(); }
  // Items + batches
  items   = (rec.items||[]).map(it=>({...it,descType:it.descType||'desc'}));
  batches = (rec.batches||[]).map(b=>({...b}));
  closeRecords(); renderBatches(); render(); window.scrollTo(0,0);
}

  if(sel.value==='__custom__'){ inp.style.display=''; inp.focus(); } else { inp.style.display='none'; inp.value=''; }
}
function getSelectVal(selId,customId) {
  const sel=document.getElementById(selId); if(!sel) return '';
  return sel.value==='__custom__'?v(customId):sel.value;
}
function getCurrency() {
  const raw = getSelectVal('currencySel','currencyCustom');
  const known = CURRENCY_SYMBOL[raw];
  if(known) return {code:raw,sym:known};
  const parts = raw.trim().split(/\s+/);
  return parts.length>=2 ? {code:parts[0],sym:parts.slice(1).join('')} : {code:raw,sym:raw};
}
function calcTotals() {
  const subtotal = items.reduce((s,it)=>s+it.qty*it.price,0);
  const taxRate  = parseFloat(v('taxRate'))||0;
  const tax = subtotal*taxRate/100;
  return {subtotal,tax,total:subtotal+tax};
}
function updateTotalsDisplay() {
  const {subtotal,tax,total} = calcTotals();
  const {sym} = getCurrency();
  document.getElementById('displaySubtotal').textContent = sym+subtotal.toFixed(2);
  document.getElementById('displayTax').textContent      = sym+tax.toFixed(2);
  document.getElementById('displayTotal').textContent    = sym+total.toFixed(2);
  document.querySelectorAll('.item-card-total').forEach((el,i)=>{
    if(items[i]) el.textContent = sym+(items[i].qty*items[i].price).toFixed(2);
  });
}
function fmtDate(dateStr) {
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day=d.getDate(); const suf=day===1||day===21||day===31?'st':day===2||day===22?'nd':day===3||day===23?'rd':'th';
  return `${months[d.getMonth()]} ${day}${suf}, ${d.getFullYear()}`;
}
function onDeliveryModeChange() {
  const m = v('deliveryMode');
  document.getElementById('deliveryDateGroup').style.display = m==='date'?'':'none';
  document.getElementById('deliveryDaysGroup').style.display = m==='days'?'':'none';
  document.getElementById('deliveryNoneGroup').style.display = m==='none'?'':'none';
}
function onDepositTypeChange() {
  const t = document.getElementById('invDepositType')?.value||'none';
  const show = (id,vis) => { const e=document.getElementById(id); if(e) e.style.display=vis?'':'none'; };
  show('invDepositAmt',t==='amount'); show('invDepositPct',t==='pct'); show('invDepositPctSign',t==='pct');
}
function buildDepositRows(cur,total) {
  const t = document.getElementById('invDepositType')?.value||'none'; if(t==='none') return '';
  let dep=0;
  if(t==='amount') dep=parseFloat(document.getElementById('invDepositAmt')?.value)||0;
  else if(t==='pct') dep=total*(parseFloat(document.getElementById('invDepositPct')?.value)||0)/100;
  if(dep<=0) return '';
  return `<tr><td>Total Amount</td><td>${cur}${total.toFixed(2)}</td></tr><tr><td>Deposit Paid</td><td>- ${cur}${dep.toFixed(2)}</td></tr>`;
}
function buildFinalTotal(total) {
  if(docMode!=='invoice') return total;
  const t=document.getElementById('invDepositType')?.value||'none';
  if(t==='none') return total;
  if(t==='amount') return Math.max(0,total-(parseFloat(document.getElementById('invDepositAmt')?.value)||0));
  if(t==='pct')    return Math.max(0,total*(1-(parseFloat(document.getElementById('invDepositPct')?.value)||0)/100));
  return total;
}
const ORDINALS=['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th'];
function buildRemarks() {
  const lines=[]; const origin=v('remarkOrigin');
  if(origin) lines.push(`${lines.length+1}. Country of Origin - ${origin}`);
  if(batches.length>0) {
    batches.forEach((b,i)=>{
      const ord=ORDINALS[i]||`${i+1}th`;
      const dstr=b.date?fmtDate(b.date):'TBD';
      lines.push(`${lines.length+1}. Delivery time: ${ord} batch${b.desc?' ('+b.desc+')':''} - ${dstr}`);
    });
  } else {
    const mode=v('deliveryMode');
    if(mode==='date'){ const d=v('deliveryDate'); if(d) lines.push(`${lines.length+1}. Delivery time: ${fmtDate(d)}`); }
    else if(mode==='days'){ const days=v('deliveryDays')||'30'; lines.push(`${lines.length+1}. Delivery time: ${days} days after receiving the down payment.`); }
  }
  if(docMode==='quotation'){
    const skip=document.getElementById('validDateSkip')?.checked;
    if(!skip){ const vd=v('validDate'); if(vd) lines.push(`${lines.length+1}. The quote is valid until ${fmtDate(vd)}.`); }
  }
  const other=v('otherRemarks').split('\n').filter(l=>l.trim());
  other.forEach(l=>lines.push(`${lines.length+1}. ${l.trim()}`));
  return lines;
}

// ══════════════════════════════════════════
//  RENDER PREVIEW
// ══════════════════════════════════════════
function renderPreview() {
  const {subtotal,tax,total} = calcTotals();
  const {code:curCode,sym:cur} = getCurrency();
  const incoTerm   = getSelectVal('incoTermSel','incoTermCustom');
  const incoLoc    = v('incoLocation');
  const incoDisplay= incoLoc?`${incoTerm} ${incoLoc}`:incoTerm;
  const payment    = getSelectVal('paymentSel','paymentCustom');
  const dateFormatted = docMode==='pi'?fmtDate(v('piDate')):docMode==='invoice'?fmtDate(v('invDate')):fmtDate(v('quotDate'));
  const invFullNum    = (v('invNum')||'')+(v('invSuffix')||'');
  const docNumber     = docMode==='pi'?v('piNum'):docMode==='invoice'?invFullNum:v('quotNum');
  const title         = docMode==='pi'?'PROFORMA INVOICE':docMode==='invoice'?'INVOICE':'Quotation';
  const numLabel      = docMode==='pi'?'PI No.':docMode==='invoice'?'Invoice No.':'Quot. #';
  const taxRate       = parseFloat(v('taxRate'))||0;
  const taxRowHTML    = taxRate>0?`<tr><td>Tax (${taxRate}%)</td><td>${cur}${tax.toFixed(2)}</td></tr>`:'';
  const remarkLines   = buildRemarks();
  const remarksHTML   = remarkLines.map(l=>`<div>${escHtml(l)}</div>`).join('');
  const buyerBlock    = [v('buyerName'),v('buyerAddr'),v('buyerPhone'),v('buyerEmail')].filter(Boolean).map(escHtml).join('<br>');
  const colHeader     = items.some(it=>it.descType==='nsn')&&items.some(it=>it.descType==='desc')?'Description / NSN':items[0]?.descType==='nsn'?'NSN Number':'Description';
  const itemRows = items.map((it,i)=>{
    const lt=(it.qty*it.price).toFixed(2);
    const dh=it.desc?escHtml(it.desc).replace(/\n/g,'<br>'):'';
    return `<tr><td class="c">${i+1}</td><td>${escHtml(it.item)}</td><td>${dh}</td><td class="c">${it.qty}</td><td class="r">${it.price.toFixed(2)}</td><td class="r">${lt}</td></tr>`;
  }).join('');

  let poRows = '';
  if(docMode==='pi'&&v('poNum')) poRows+=`<tr><td>PO Number</td><td>${escHtml(v('poNum'))}</td></tr>`;
  if(docMode==='invoice'&&v('invPoNum')) poRows+=`<tr><td>PO Number</td><td>${escHtml(v('invPoNum'))}</td></tr>`;
  if(docMode==='invoice'&&v('invRefPi')) poRows+=`<tr><td>Ref. PI No.</td><td>${escHtml(v('invRefPi'))}</td></tr>`;

  const balLabel = docMode==='invoice'?'Balance Due':'Total Amount';
  const finalTotal = buildFinalTotal(total);

  document.getElementById('quote-preview').innerHTML = `
    <div class="pv-letterhead">
      <img class="pv-logo-img" id="pvLogo" alt="CS Logo">
      <div class="pv-company-info">
        <div class="pv-company-name">${escHtml(v('sellerName'))}</div>
        <div class="pv-company-details">
          Email : ${escHtml(v('sellerEmail'))}<br>
          TEL: ${escHtml(v('sellerTel'))} Fax: ${escHtml(v('sellerFax'))}<br>
          Addr: ${escHtml(v('sellerAddr'))}
        </div>
      </div>
    </div>
    <div class="pv-title">${title}</div>
    <div class="pv-meta-grid">
      <div style="padding-right:18px">
        <div class="pv-to-block"><div class="pv-to-label">TO</div>${buyerBlock}</div>
      </div>
      <table class="pv-info-table">
        <tr><td>DATE</td><td>${dateFormatted}</td></tr>
        <tr><td>${numLabel}</td><td>${escHtml(docNumber)}</td></tr>
        ${poRows}
        <tr><td>INCO TERM</td><td>${escHtml(incoDisplay)}</td></tr>
        <tr><td>PAYMENT</td><td>${escHtml(payment)}</td></tr>
      </table>
    </div>
    <table class="pv-items-table">
      <thead><tr>
        <th style="width:42px">Item No.</th><th style="width:110px">Item</th>
        <th>${colHeader}</th><th style="width:48px">Qty</th>
        <th style="width:88px">Unit Price<br><span style="font-size:9px;font-weight:400">${curCode}</span></th>
        <th style="width:88px">Line Total<br><span style="font-size:9px;font-weight:400">${curCode}</span></th>
      </tr></thead>
      <tbody>${itemRows}</tbody>
    </table>
    <div class="pv-bottom">
      <div class="pv-remark">
        <div class="pv-remark-label">Remark</div>${remarksHTML}
      </div>
      <table class="pv-totals-table">
        <tr><td>Subtotal</td><td>${cur}${subtotal.toFixed(2)}</td></tr>
        ${taxRowHTML}
        ${docMode==='invoice'?buildDepositRows(cur,total):''}
        <tr class="grand-row"><td>${balLabel}</td><td>${cur}${finalTotal.toFixed(2)}</td></tr>
      </table>
    </div>
    <div class="pv-footer">
      <div class="pv-sig">
        <div class="pv-sig-title">Director</div>
        <div class="pv-sig-line"></div>
        <div class="pv-sig-name">${escHtml(v('director'))}</div>
      </div>
    </div>
    ${(docMode==='pi'||docMode==='invoice')?buildBankHTML():''}
  `;
  // Set logo src separately (avoids huge template literal)
  const pvLogo = document.getElementById('pvLogo');
  if (pvLogo) pvLogo.src = LOGO_SRC;
}
function render() { try { renderItemsForm(); renderBatches(); updateTotalsDisplay(); renderPreview(); } catch(e) { console.error('render error:', e); } }

// ══════════════════════════════════════════
//  PDF EXPORT
// ══════════════════════════════════════════
async function exportPDF() {
  const btn = document.querySelector('.btn-hdr-pdf');
  const orig = btn?.textContent;
  if(btn){ btn.textContent='⏳…'; btn.disabled=true; }
  try {
    const el = document.getElementById('quote-preview');
    const canvas = await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
    const imgData = canvas.toDataURL('image/png');
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pW=pdf.internal.pageSize.getWidth(), pH=pdf.internal.pageSize.getHeight();
    const ratio=Math.min(pW/(canvas.width/3.7795),pH/(canvas.height/3.7795));
    pdf.addImage(imgData,'PNG',(pW-(canvas.width/3.7795)*ratio)/2,0,(canvas.width/3.7795)*ratio,(canvas.height/3.7795)*ratio);
    const dn = docMode==='pi'?(v('piNum')||'PI'):docMode==='invoice'?((v('invNum')||'')+(v('invSuffix')||'')||'INV'):(v('quotNum')||'Q');
    const pfx = docMode==='pi'?'PI':docMode==='invoice'?'Invoice':'Quotation';
    pdf.save(`${pfx}_${dn}.pdf`);
  } catch(e) { alert('PDF失敗: '+e.message); }
  finally { if(btn){ btn.textContent=orig; btn.disabled=false; } }
}

// ══════════════════════════════════════════
//  RESIZER
// ══════════════════════════════════════════
(function() {
  const resizer = document.getElementById('resizer');
  const fp = document.querySelector('.form-panel');
  let drag=false, sx=0, sw=0;
  resizer.addEventListener('mousedown', e=>{ drag=true; sx=e.clientX; sw=fp.offsetWidth; resizer.classList.add('dragging'); document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; });
  document.addEventListener('mousemove', e=>{ if(!drag) return; fp.style.width=Math.max(260,Math.min(sw+e.clientX-sx,window.innerWidth*.72))+'px'; });
  document.addEventListener('mouseup', ()=>{ if(!drag) return; drag=false; resizer.classList.remove('dragging'); document.body.style.cursor=''; document.body.style.userSelect=''; });
})();
